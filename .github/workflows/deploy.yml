name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options: [production, staging]
      image_sha:
        description: 'Exact tested Git commit SHA to deploy'
        required: true
        type: string

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host:     ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key:      ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/jtl-dashboard

            repository="$(printf '%s' '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
            export JTL_API_IMAGE="ghcr.io/$repository/jtl-api:${{ github.event.inputs.image_sha }}"
            export JTL_WEB_IMAGE="ghcr.io/$repository/jtl-frontend:${{ github.event.inputs.image_sha }}"

            docker compose -f docker-compose.prod.yml pull nestjs-api nextjs-frontend
            docker compose -f docker-compose.prod.yml up -d --force-recreate --no-deps nestjs-api nextjs-frontend apache

            # Wait for API health check
            sleep 10
            docker compose -f docker-compose.prod.yml exec -T nestjs-api wget -qO- http://localhost:3001/api/healthz | grep -q '${{ github.event.inputs.image_sha }}' || exit 1

            echo "Deploy complete"

      - name: Notify on success
        if: success()
        run: echo "Deployed to ${{ github.event.inputs.environment }} successfully"

      - name: Notify on failure
        if: failure()
        run: echo "Deployment to ${{ github.event.inputs.environment }} FAILED"
