name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  packages: write

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  compose-config:
    name: Docker Compose Config
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Prepare env templates
        run: |
          cp backend/.env.example backend/.env
          cp backend/.env.production.example backend/.env.production

      - name: Validate local compose
        run: docker compose config

      - name: Validate production compose
        env:
          BACKEND_ENV_FILE: ./backend/.env.production
          JTL_API_IMAGE: example.invalid/jtl-api:test
          JTL_WEB_IMAGE: example.invalid/jtl-web:test
        run: docker compose -f docker-compose.prod.yml config --quiet

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: [secret-scan, compose-config]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jtl_analytics_test
          POSTGRES_USER: jtl_api
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Typecheck backend
        working-directory: backend
        run: npm run typecheck

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Run backend tests
        working-directory: backend
        env:
          NODE_ENV: test
          PG_HOST: localhost
          PG_PORT: 5432
          PG_DATABASE: jtl_analytics_test
          PG_USER: jtl_api
          PG_PASSWORD: testpassword
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_ACCESS_SECRET: test-secret-32chars-minimum-here
          JWT_REFRESH_SECRET: test-refresh-secret-32chars-here
        run: npm test

  schema-profiles:
    name: Schema Profile (${{ matrix.profile }})
    runs-on: ubuntu-latest
    needs: [secret-scan]
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: legacy
            schema_end: 18
          - profile: canonical
            schema_end: 19
          - profile: marketplace-disabled
            schema_end: 20
          - profile: marketplace-enabled
            schema_end: 21
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jtl_schema_profile
          POSTGRES_USER: jtl_api
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Apply bounded schema profile
        env:
          PGPASSWORD: testpassword
          SCHEMA_END: ${{ matrix.schema_end }}
        run: |
          for file in $(find backend/init-db -maxdepth 1 -name '*.sql' | sort); do
            prefix=$(basename "$file" | cut -d- -f1)
            if [ "$((10#$prefix))" -le "$SCHEMA_END" ]; then
              psql -v ON_ERROR_STOP=1 -h localhost -U jtl_api -d jtl_schema_profile -f "$file" >/dev/null
            fi
          done
      - name: Verify schema capability profile
        working-directory: backend
        env:
          SCHEMA_PROFILE: ${{ matrix.profile }}
          PG_HOST: localhost
          PG_PORT: 5432
          PG_DATABASE: jtl_schema_profile
          PG_USER: jtl_api
          PG_PASSWORD: testpassword
        run: npm run test:schema-profile
      - name: Build backend runtime
        working-directory: backend
        run: npm run build
      - name: Verify live API and ingest profile
        working-directory: backend
        env:
          SCHEMA_PROFILE: ${{ matrix.profile }}
          API_BASE_URL: http://127.0.0.1:3101/api
          NODE_ENV: test
          PORT: 3101
          PG_HOST: localhost
          PG_PORT: 5432
          PG_DATABASE: jtl_schema_profile
          PG_USER: jtl_api
          PG_PASSWORD: testpassword
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_ACCESS_SECRET: test-secret-32chars-minimum-here
          JWT_REFRESH_SECRET: test-refresh-secret-32chars-here
          COMPARISON_CENTRE_ENABLED: "true"
        run: |
          node dist/main.js > /tmp/schema-profile-api.log 2>&1 &
          api_pid=$!
          trap 'kill $api_pid 2>/dev/null || true; cat /tmp/schema-profile-api.log' EXIT
          npm run test:schema-profile-runtime

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: [secret-scan, compose-config]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Run frontend tests
        working-directory: web
        run: npm run test:run

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: [frontend-test]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build Next.js
        working-directory: web
        env:
          NEXT_PUBLIC_API_URL: /api
        run: npm run build

  docker-smoke:
    name: Isolated Docker Smoke
    runs-on: ubuntu-latest
    needs: [backend-test]

    steps:
      - uses: actions/checkout@v4

      - name: Verify live inventory contract
        run: make smoke-docker

  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, docker-smoke]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image namespace
        id: image
        shell: bash
        run: echo "namespace=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.image.outputs.namespace }}/jtl-api:${{ github.sha }}
          build-args: |
            APP_VERSION=1.0.0
            BUILD_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./web
          push: true
          tags: ${{ steps.image.outputs.namespace }}/jtl-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
