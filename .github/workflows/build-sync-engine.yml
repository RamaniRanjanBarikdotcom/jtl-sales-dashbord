name: Build Sync Engine

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version
        required: true
        default: 1.0.0

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SYNC_ENGINE_VERSION: ${{ inputs.version || '1.0.0' }}
  WINDOWS_SIGNING_AVAILABLE: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 != '' }}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Verify backend contracts
        working-directory: backend
        run: |
          npm ci
          npm run typecheck
          npm test -- --runInBand

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Build complete solution
        shell: pwsh
        run: |
          $buildTime = [DateTime]::UtcNow.ToString("O")
          "BUILD_TIME=$buildTime" | Out-File -FilePath $env:GITHUB_ENV -Append
          dotnet build sync-engine-dotnet/JtlSyncEngine.sln -c Release `
            -p:Version=$env:SYNC_ENGINE_VERSION `
            -p:GitSha=${{ github.sha }} -p:BuildTime=$buildTime

      - name: Run sync-engine core tests
        shell: pwsh
        run: |
          dotnet test sync-engine-dotnet/JtlSyncEngine.Core.Tests/JtlSyncEngine.Core.Tests.csproj `
            -c Release --no-build

      # These run elevated on a production server, where a syntax error would only
      # surface at the point of registering the service.
      - name: Parse-check service tools
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem sync-engine-dotnet/service-tools -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) {
              $failed = $true
              Write-Host "::error file=$($_.FullName)::$($errors | ForEach-Object { $_.Message })"
            }
          }
          if ($failed) { throw "One or more service tools failed to parse." }

      - name: Publish portable Sync Engine, service host and updater
        shell: pwsh
        env:
          SYNC_AGENT_MANIFEST_PUBLIC_KEY_PEM: ${{ secrets.SYNC_AGENT_MANIFEST_PUBLIC_KEY_PEM }}
        run: |
          dotnet publish sync-engine-dotnet/JtlSyncEngine/JtlSyncEngine.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:Version=$env:SYNC_ENGINE_VERSION `
            -p:GitSha=${{ github.sha }} -p:BuildTime=$env:BUILD_TIME `
            -o artifacts/stage/portable
          dotnet publish sync-engine-dotnet/JtlSyncEngine.Updater/JtlSyncEngine.Updater.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:Version=$env:SYNC_ENGINE_VERSION `
            -p:GitSha=${{ github.sha }} -p:BuildTime=$env:BUILD_TIME `
            -o artifacts/stage/updater
          # Self-contained: the Windows Server may have no .NET runtime installed, and
          # the service starts before any user logs in, so it cannot prompt for one.
          dotnet publish sync-engine-dotnet/JtlSyncEngine.Service/JtlSyncEngine.Service.csproj `
            -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true `
            -p:Version=$env:SYNC_ENGINE_VERSION `
            -p:GitSha=${{ github.sha }} -p:BuildTime=$env:BUILD_TIME `
            -o artifacts/stage/service
          Remove-Item artifacts/stage/portable/*.pdb -ErrorAction SilentlyContinue
          Copy-Item artifacts/stage/updater/JtlSyncEngine.Updater.exe artifacts/stage/portable/
          # Without these two the downloaded ZIP cannot register the service at all,
          # which is why auto-start after reboot never worked.
          Copy-Item artifacts/stage/service/JtlSyncEngine.Service.exe artifacts/stage/portable/
          Copy-Item sync-engine-dotnet/service-tools artifacts/stage/portable/service-tools -Recurse
          Copy-Item sync-engine-dotnet/JtlSyncEngine/settings.example.json artifacts/stage/portable/
          @"
          {
            "applicationId": "JtlSyncEngine",
            "version": "$env:SYNC_ENGINE_VERSION",
            "gitSha": "${{ github.sha }}",
            "architecture": "win-x64",
            "protocolVersion": 2
          }
          "@ | Set-Content artifacts/stage/portable/version.json -Encoding UTF8
          @"
          JTL Sync Engine - Portable

          1. Extract this ZIP to a normal user-owned folder.
             Do not run it from inside the ZIP or from a temporary folder.
          2. Double-click JtlSyncEngine.exe.
             It starts without asking for administrator approval.
          3. Enter the tenant ID, API key, backend URL, and JTL connection settings.

          Keeping syncing alive after a server restart
          -------------------------------------------
          Settings offers two separate options. Pick whichever your server allows.

          "Start when I sign in to this server"
            Needs no administrator approval at all, so it works on servers where
            nobody can answer a UAC prompt. The app opens by itself whenever this
            Windows account signs in. Nothing syncs while nobody is signed in.

          "Sync in the background even when nobody is signed in"
            Registers a Windows service that starts on boot, before anyone logs in,
            so syncing resumes on its own after an unattended restart. Windows asks
            for administrator approval once, at the moment you tick it.
            Afterwards you no longer need to open this app for syncing to happen -
            opening it shows live status, logs and manual controls instead.

          Untick either box to undo it. Removing the service goes back to syncing
          only while this app is open.

          If the app is already running, double-clicking JtlSyncEngine.exe again
          brings its window back to the front rather than doing nothing.

          There is still no installer - this stays click-to-run.

          Moving this folder later is fine. The app corrects its own startup entry
          the next time it opens.
          "@ | Set-Content artifacts/stage/portable/README-PORTABLE.txt -Encoding UTF8
          if (-not [string]::IsNullOrWhiteSpace($env:SYNC_AGENT_MANIFEST_PUBLIC_KEY_PEM)) {
            $env:SYNC_AGENT_MANIFEST_PUBLIC_KEY_PEM |
              Set-Content artifacts/stage/portable/manifest-public-key.pem -Encoding ascii
          }

      - name: Authenticode sign published binaries
        if: env.WINDOWS_SIGNING_AVAILABLE == 'true'
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "jtl-code-signing.pfx"
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Filter signtool.exe -Recurse |
            Where-Object FullName -Match '\\x64\\signtool.exe$' |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe was not found." }
          Get-ChildItem artifacts/stage/portable -Recurse `
            -Include JtlSyncEngine*.exe,JtlSyncEngine*.dll | ForEach-Object {
              & $signtool.FullName sign /fd SHA256 /td SHA256 `
                /f $certificatePath /p $env:WINDOWS_SIGNING_CERT_PASSWORD `
                /tr http://timestamp.digicert.com $_.FullName
              if ($LASTEXITCODE -ne 0) { throw "Signing failed for $($_.FullName)" }
            }

      - name: Package immutable artifacts
        shell: pwsh
        run: |
          # Auto-start after reboot depends on both of these being in the ZIP. They
          # were missing before, which is why the service could never be registered.
          foreach ($required in @(
              "artifacts/stage/portable/JtlSyncEngine.Service.exe",
              "artifacts/stage/portable/service-tools/install-service.ps1",
              "artifacts/stage/portable/service-tools/migrate-config.ps1",
              "artifacts/stage/portable/service-tools/uninstall-service.ps1")) {
            if (-not (Test-Path $required)) {
              throw "Refusing to package: $required is missing, so the background service could not be installed on the server."
            }
          }
          Compress-Archive artifacts/stage/portable/* artifacts/JtlSyncEngine-Portable-win-x64.zip
          @"
          version=$env:SYNC_ENGINE_VERSION
          gitSha=${{ github.sha }}
          buildTime=$env:BUILD_TIME
          configurationSchemaVersion=1
          migrationVersion=1
          "@ | Set-Content artifacts/build-manifest.txt

      - name: Build signed routine update package
        if: env.WINDOWS_SIGNING_AVAILABLE == 'true'
        shell: pwsh
        run: |
          New-Item artifacts/update-package/payload -ItemType Directory -Force | Out-Null
          Copy-Item artifacts/stage/portable/* artifacts/update-package/payload -Recurse
          Compress-Archive artifacts/update-package/payload artifacts/JtlSyncEngine-Update-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: sync-engine-${{ github.sha }}
          path: |
            artifacts/JtlSyncEngine-Portable-win-x64.zip
            artifacts/JtlSyncEngine-Update-win-x64.zip
            artifacts/build-manifest.txt
          if-no-files-found: ignore

      - name: Publish immutable prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $shortSha = "${{ github.sha }}".Substring(0, 12)
          $tag = "sync-engine-v$env:SYNC_ENGINE_VERSION-$shortSha"
          $releaseFiles = @(
            "artifacts/JtlSyncEngine-Portable-win-x64.zip",
            "artifacts/build-manifest.txt"
          )
          if (Test-Path artifacts/JtlSyncEngine-Update-win-x64.zip) {
            $releaseFiles += "artifacts/JtlSyncEngine-Update-win-x64.zip"
          }
          gh release create $tag $releaseFiles `
            --repo "${{ github.repository }}" `
            --title "JTL Sync Engine v$env:SYNC_ENGINE_VERSION ($shortSha)" `
            --notes "Portable click-to-run build from commit ${{ github.sha }}. Extract the ZIP and double-click JtlSyncEngine.exe; no installer is required. To keep syncing after a server restart, tick 'Start automatically when Windows starts' in Settings and approve the one-time administrator prompt." `
            --prerelease
