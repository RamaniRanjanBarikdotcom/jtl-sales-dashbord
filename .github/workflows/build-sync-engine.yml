name: Build Sync Engine

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version
        required: true
        default: 1.0.0

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SYNC_ENGINE_VERSION: ${{ inputs.version || '1.0.0' }}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Verify backend contracts
        working-directory: backend
        run: |
          npm ci
          npm run typecheck
          npm test -- --runInBand

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Build complete solution
        shell: pwsh
        run: |
          $buildTime = [DateTime]::UtcNow.ToString("O")
          "BUILD_TIME=$buildTime" | Out-File -FilePath $env:GITHUB_ENV -Append
          dotnet build sync-engine-dotnet/JtlSyncEngine.sln -c Release `
            -p:Version=$env:SYNC_ENGINE_VERSION `
            -p:GitSha=${{ github.sha }} -p:BuildTime=$buildTime

      - name: Run sync-engine core tests
        shell: pwsh
        run: |
          dotnet test sync-engine-dotnet/JtlSyncEngine.Core.Tests/JtlSyncEngine.Core.Tests.csproj `
            -c Release --no-build

      - name: Publish service and UI
        shell: pwsh
        run: |
          dotnet publish sync-engine-dotnet/JtlSyncEngine.Service/JtlSyncEngine.Service.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:Version=$env:SYNC_ENGINE_VERSION `
            -p:GitSha=${{ github.sha }} -p:BuildTime=$env:BUILD_TIME `
            -o artifacts/stage/service
          dotnet publish sync-engine-dotnet/JtlSyncEngine/JtlSyncEngine.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:Version=$env:SYNC_ENGINE_VERSION `
            -p:GitSha=${{ github.sha }} -p:BuildTime=$env:BUILD_TIME `
            -o artifacts/stage/ui
          Copy-Item sync-engine-dotnet/service-tools artifacts/stage/service-tools -Recurse
          Copy-Item sync-engine-dotnet/service-tools artifacts/stage/ui/service-tools -Recurse
          Copy-Item sync-engine-dotnet/JtlSyncEngine/settings.example.json artifacts/stage/ui/
          Copy-Item sync-engine-dotnet/JtlSyncEngine/deployment-notes.txt artifacts/stage/ui/

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $env:SYNC_ENGINE_STAGE = (Resolve-Path artifacts/stage).Path
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" sync-engine-dotnet/installer/JtlSyncEngine.iss

      - name: Package immutable artifacts
        shell: pwsh
        run: |
          Compress-Archive artifacts/stage/service/* artifacts/JtlSyncEngine-Service-win-x64.zip
          Compress-Archive artifacts/stage/ui/* artifacts/JtlSyncEngine-UI-win-x64.zip
          @"
          version=$env:SYNC_ENGINE_VERSION
          gitSha=${{ github.sha }}
          buildTime=$env:BUILD_TIME
          configurationSchemaVersion=1
          migrationVersion=1
          "@ | Set-Content artifacts/build-manifest.txt

      - uses: actions/upload-artifact@v4
        with:
          name: sync-engine-${{ github.sha }}
          path: |
            artifacts/JtlSyncEngine-Service-win-x64.zip
            artifacts/JtlSyncEngine-UI-win-x64.zip
            artifacts/JtlSyncEngine-Installer-win-x64.exe
            artifacts/build-manifest.txt

      - name: Publish immutable prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $shortSha = "${{ github.sha }}".Substring(0, 12)
          $tag = "sync-engine-v$env:SYNC_ENGINE_VERSION-$shortSha"
          gh release create $tag artifacts/JtlSyncEngine-Service-win-x64.zip `
            artifacts/JtlSyncEngine-UI-win-x64.zip `
            artifacts/JtlSyncEngine-Installer-win-x64.exe `
            artifacts/build-manifest.txt `
            --repo "${{ github.repository }}" `
            --title "JTL Sync Engine v$env:SYNC_ENGINE_VERSION ($shortSha)" `
            --notes "Immutable build from commit ${{ github.sha }}." `
            --prerelease
