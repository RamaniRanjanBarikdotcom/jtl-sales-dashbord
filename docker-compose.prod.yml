x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

networks:
  jtl-net:
    driver: bridge

volumes:
  redis_data:
    name: backend_redis_data
  redis_queue_data:
    name: backend_redis_queue_data
  certbot_certs:
  certbot_www:
  agent_release_data:

services:

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    env_file: ${BACKEND_ENV_FILE:-./backend/.env.production}
    command: /bin/sh -c 'redis-server --requirepass "$${REDIS_PASSWORD}" --maxmemory 512mb --maxmemory-policy allkeys-lru'
    volumes:
      - redis_data:/data
    networks: [jtl-net]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-queue:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    profiles: [marketplaces]
    env_file: ${BACKEND_ENV_FILE:-./backend/.env.production}
    command: /bin/sh -c 'redis-server --requirepass "$${REDIS_QUEUE_PASSWORD}" --maxmemory "$${REDIS_QUEUE_MAXMEMORY:-512mb}" --maxmemory-policy noeviction --appendonly yes --appendfsync everysec'
    volumes:
      - redis_queue_data:/data
    networks: [jtl-net]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_QUEUE_PASSWORD}\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nestjs-api:
    image: ${JTL_API_IMAGE:?Set JTL_API_IMAGE to the tested SHA-tagged API image}
    restart: unless-stopped
    logging: *default-logging
    env_file: ${BACKEND_ENV_FILE:-./backend/.env.production}
    environment:
      NODE_OPTIONS: "--dns-result-order=ipv4first --no-network-family-autoselection"
      SYNC_AGENT_RELEASE_STORAGE_PATH: /app/agent-releases
    volumes:
      - agent_release_data:/app/agent-releases
    networks: [jtl-net]
    expose:
      - "3001"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --header='x-api-version: 1' http://127.0.0.1:3001/api/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nextjs-frontend:
    image: ${JTL_WEB_IMAGE:?Set JTL_WEB_IMAGE to the tested SHA-tagged web image}
    restart: unless-stopped
    logging: *default-logging
    environment:
      NEXT_PUBLIC_API_URL: /api
    networks: [jtl-net]
    depends_on:
      nestjs-api:
        condition: service_healthy
    expose:
      - "3000"

  marketplace-scheduler:
    profiles: [marketplaces]
    image: ${JTL_API_IMAGE:?Set JTL_API_IMAGE to the tested SHA-tagged API image}
    command: ["node", "dist/workers/marketplace-scheduler.main"]
    restart: unless-stopped
    logging: *default-logging
    env_file: ${BACKEND_ENV_FILE:-./backend/.env.production}
    environment: { PG_POOL_MAX: "2" }
    networks: [jtl-net]
    depends_on:
      redis-queue: { condition: service_healthy }

  marketplace-realtime:
    profiles: [marketplaces]
    image: ${JTL_API_IMAGE:?Set JTL_API_IMAGE to the tested SHA-tagged API image}
    command: ["node", "dist/workers/marketplace-realtime.main"]
    restart: unless-stopped
    logging: *default-logging
    env_file: ${BACKEND_ENV_FILE:-./backend/.env.production}
    environment: { PG_POOL_MAX: "3" }
    networks: [jtl-net]
    depends_on:
      redis-queue: { condition: service_healthy }

  marketplace-bulk:
    profiles: [marketplaces]
    image: ${JTL_API_IMAGE:?Set JTL_API_IMAGE to the tested SHA-tagged API image}
    command: ["node", "dist/workers/marketplace-bulk.main"]
    restart: unless-stopped
    logging: *default-logging
    env_file: ${BACKEND_ENV_FILE:-./backend/.env.production}
    environment: { PG_POOL_MAX: "2" }
    networks: [jtl-net]
    depends_on:
      redis-queue: { condition: service_healthy }

  marketplace-postprocess:
    profiles: [marketplaces]
    image: ${JTL_API_IMAGE:?Set JTL_API_IMAGE to the tested SHA-tagged API image}
    command: ["node", "dist/workers/marketplace-postprocess.main"]
    restart: unless-stopped
    logging: *default-logging
    env_file: ${BACKEND_ENV_FILE:-./backend/.env.production}
    environment: { PG_POOL_MAX: "2" }
    networks: [jtl-net]
    depends_on:
      redis-queue: { condition: service_healthy }

  apache:
    image: httpd:2.4-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./apache/httpd.prod.conf:/usr/local/apache2/conf/httpd.conf:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    networks: [jtl-net]
    depends_on:
      - nextjs-frontend
      - nestjs-api

  # Certbot renews SSL certificate automatically every 12 hours
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;'"
